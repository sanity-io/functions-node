name: CI

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  build:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: lts/*
      - run: npm ci
      - run: npm run prepare
      - run: npm run typecheck
      - run: npm run lint
        # verify the build output can be consumed downstream
      - name: Verify packaged ESM and NodeNext declarations
        shell: bash
        run: |
          TARBALL="$(npm pack --json | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input)[0].filename))')"
          TEMP_DIR="$(mktemp -d)"
          tar -xzf "$TARBALL" -C "$TEMP_DIR"

          # Catches extensionless imports in emitted JavaScript.
          node --input-type=module --eval 'await import(process.argv[1])' \
            "$TEMP_DIR/package/dist/index.js"

          # Catches extensionless imports preserved in emitted .d.ts files.
          mkdir "$TEMP_DIR/consumer"
          node -e "
            const fs = require('fs');
            const dir = process.argv[1];
            fs.writeFileSync(dir + '/index.ts', [
              \"import type { DurableHandler, SyncTagInvalidateEventHandler } from '../package/dist/index.js'\",
              'export type PublicApiCheck = { durable: DurableHandler; syncTagInvalidate: SyncTagInvalidateEventHandler }',
            ].join('\\n'));
            fs.writeFileSync(dir + '/tsconfig.json', JSON.stringify({
              compilerOptions: { module: 'NodeNext', moduleResolution: 'NodeNext', target: 'ES2024', strict: true, skipLibCheck: false, noEmit: true },
              files: ['index.ts']
            }, null, 2));
          " "$TEMP_DIR/consumer"

          ./node_modules/.bin/tsc --project "$TEMP_DIR/consumer/tsconfig.json"
      - uses: actions/upload-artifact@v7
        name: Cache build output
        with:
          retention-days: 1
          name: build-output-${{ github.run_id }}
          path: |
            dist/

  coverage:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: Test and report coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: lts/*
      - run: npm ci
      - run: npm run coverage
      - uses: davelosert/vitest-coverage-report-action@7bf7d3c1b17a0e27c7e0d14190fb39168584bed2 # v2
        if: always()

  test:
    name: Test
    needs: [build, coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run the testing suite on each major OS with the latest LTS release of Node.js
        os: [macos-latest, ubuntu-latest, windows-latest]
        node-version: ["22.x", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
